<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy 15th Anniversary!</title>


<style>

    /* =====================================================
       PAGE
       ===================================================== */

    html,
    body {

        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        background: #fff;

    }


    /* =====================================================
       TOUCHDESIGNER OUTPUT
       ===================================================== */

    #processedVideo {

        position: absolute;

        inset: 0;

        width: 100%;
        height: 100%;

        object-fit: cover;
        object-position: center;

        z-index: 1;

    }


    /* =====================================================
       LOCAL CAMERA PREVIEW
       
       Holobox:
           1440 x 2560

       Aspect ratio:
           1440 / 2560 = 9 / 16

       Using 25% of the screen height:
           2560 × 0.25 = 640px

       At 9:16:
           640 × (9/16) = 360px

       So on a 1440 x 2560 screen this becomes:
           360 x 640
       ===================================================== */

    #localVideo {

        position: absolute;

        top: 32px;
        right: 32px;

        height: 25vh;
        width: auto;

        aspect-ratio: 9 / 16;

        object-fit: cover;
        object-position: center;

        transform: scaleX(-1);

        z-index: 10;

        background: #fff;

        border: 3px solid rgba(
            255,
            255,
            255,
            0.9
        );

        border-radius: 8px;

        box-sizing: border-box;

    }


    /* =====================================================
       VERY SUBTLE SHADOW AROUND CAMERA
       ===================================================== */

    #localVideo {

        box-shadow:
            0 8px 30px rgba(
                0,
                0,
                0,
                0.35
            );

    }


    /* =====================================================
       HIDE ELEMENTS UNTIL THEY HAVE VIDEO
       ===================================================== */

    video {

        display: block;

    }

</style>

</head>

<body>

<!-- =====================================================
     TOUCHDESIGNER OUTPUT
     ===================================================== -->

<video
    id="processedVideo"
    autoplay
    playsinline>
</video>


<!-- =====================================================
     LOCAL CAMERA PREVIEW
     ===================================================== -->

<video
    id="localVideo"
    autoplay
    muted
    playsinline>
</video>


<script>

    // ====================================================
    // HTML ELEMENTS
    // ====================================================

    const localVideo =
        document.getElementById(
            "localVideo"
        );


    const processedVideo =
        document.getElementById(
            "processedVideo"
        );


    // ====================================================
    // CLOUDFARE WORKER / WEBSOCKET
    // ====================================================

    const SIGNALING_URL =
        "wss://body-signaling.reeseyh18.workers.dev/ws";


    // ====================================================
    // WEBRTC CONNECTION
    // ====================================================

    const pc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }

            ]

        });


    // ====================================================
    // VARIABLES
    // ====================================================

    let cameraStream = null;

    let started = false;

    const pendingCandidates = [];


    // ====================================================
    // CONNECT TO SIGNALING SERVER
    // ====================================================

    const signal =
        new WebSocket(
            SIGNALING_URL
        );


    // ====================================================
    // WEBSOCKET CONNECTED
    // ====================================================

    signal.onopen = () => {

        console.log(
            "Connected to signaling server"
        );


        signal.send(

            JSON.stringify({

                type: "join",

                room: "body-demo",

                role: "browser"

            })

        );

    };


    // ====================================================
    // SIGNALING MESSAGES
    // ====================================================

    signal.onmessage =
        async (event) => {

            console.log(
                "SIGNAL RECEIVED:",
                event.data
            );


            const message =
                JSON.parse(
                    event.data
                );


            // ------------------------------------------------
            // BOTH BROWSER + TOUCHDESIGNER ARE READY
            // ------------------------------------------------

            if (
                message.type === "ready"
            ) {

                console.log(
                    "TouchDesigner is ready"
                );


                await startWebRTC();

            }


            // ------------------------------------------------
            // TOUCHDESIGNER ANSWER
            // ------------------------------------------------

            else if (
                message.type === "answer"
            ) {

                console.log(
                    "Received answer from TouchDesigner"
                );


                await pc.setRemoteDescription(

                    new RTCSessionDescription(
                        message.sdp
                    )

                );


                // Add candidates that arrived
                // before the remote description.
                while (
                    pendingCandidates.length > 0
                ) {

                    const candidate =
                        pendingCandidates.shift();


                    await pc.addIceCandidate(
                        candidate
                    );

                }

            }


            // ------------------------------------------------
            // TOUCHDESIGNER ICE CANDIDATE
            // ------------------------------------------------

            else if (
                message.type === "candidate"
            ) {

                const candidate =
                    new RTCIceCandidate(
                        message.candidate
                    );


                if (
                    pc.remoteDescription
                ) {

                    await pc.addIceCandidate(
                        candidate
                    );

                }

                else {

                    pendingCandidates.push(
                        candidate
                    );

                }

            }


            // ------------------------------------------------
            // TOUCHDESIGNER LEFT
            // ------------------------------------------------

            else if (
                message.type === "peer-left"
            ) {

                console.log(
                    "TouchDesigner disconnected"
                );


                processedVideo.srcObject =
                    null;

            }


            // ------------------------------------------------
            // ERROR
            // ------------------------------------------------

            else if (
                message.type === "error"
            ) {

                console.error(
                    "SIGNALING ERROR:",
                    message.message
                );

            }

        };


    // ====================================================
    // START WEBRTC
    // ====================================================

    async function startWebRTC() {

        // Don't start twice.
        if (started) {

            return;

        }

        started = true;


        console.log(
            "Starting WebRTC..."
        );


        // ------------------------------------------------
        // REQUEST CAMERA
        // ------------------------------------------------

        try {

            cameraStream =
                await navigator.mediaDevices
                    .getUserMedia({

                        video: {

                            width: {
                                ideal: 1440
                            },

                            height: {
                                ideal: 2560
                            },

                            frameRate: {
                                ideal: 30
                            }

                        },

                        audio: false

                    });

        }

        catch (error) {

            console.error(
                "Camera error:",
                error
            );

            return;

        }


        console.log(
            "Camera permission granted"
        );


        // ------------------------------------------------
        // DISPLAY LOCAL CAMERA PREVIEW
        // ------------------------------------------------

        localVideo.srcObject =
            cameraStream;


        // ------------------------------------------------
        // SEND CAMERA TO TOUCHDESIGNER
        // ------------------------------------------------

        for (
            const track
            of cameraStream.getTracks()
        ) {

            pc.addTrack(
                track,
                cameraStream
            );

        }


        // ------------------------------------------------
        // CREATE WEBRTC OFFER
        // ------------------------------------------------

        const offer =
            await pc.createOffer();


        await pc.setLocalDescription(
            offer
        );


        console.log(
            "Created WebRTC offer"
        );


        // ------------------------------------------------
        // SEND OFFER THROUGH WSS
        // ------------------------------------------------

        signal.send(

            JSON.stringify({

                type: "offer",

                sdp:
                    pc.localDescription

            })

        );

    }


    // ====================================================
    // SEND ICE CANDIDATES TO TOUCHDESIGNER
    // ====================================================

    pc.onicecandidate =
        (event) => {

            if (
                !event.candidate
            ) {

                return;

            }


            signal.send(

                JSON.stringify({

                    type: "candidate",

                    candidate: {

                        candidate:
                            event.candidate
                                .candidate,

                        sdpMid:
                            event.candidate
                                .sdpMid,

                        sdpMLineIndex:
                            event.candidate
                                .sdpMLineIndex

                    }

                })

            );

        };


    // ====================================================
    // RECEIVE TOUCHDESIGNER VIDEO
    // ====================================================

    pc.ontrack =
        (event) => {

            console.log(
                "Received video track from TouchDesigner"
            );


            if (
                event.streams &&
                event.streams[0]
            ) {

                processedVideo.srcObject =
                    event.streams[0];


                processedVideo.play()
                    .catch(
                        (error) => {

                            console.error(
                                "Video play error:",
                                error
                            );

                        }
                    );

            }

        };


    // ====================================================
    // WEBRTC CONNECTION STATE
    // ====================================================

    pc.onconnectionstatechange =
        () => {

            console.log(
                "WebRTC connection state:",
                pc.connectionState
            );

        };


    // ====================================================
    // WEBSOCKET CLOSED
    // ====================================================

    signal.onclose = () => {

        console.log(
            "Signaling server disconnected"
        );

    };


    // ====================================================
    // WEBSOCKET ERROR
    // ====================================================

    signal.onerror =
        (error) => {

            console.error(
                "WebSocket error:",
                error
            );

        };

</script>
