<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy 15th Anniversary!</title>

<style>

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #fff;
    }

    #videos {
        display: flex;
        width: 100%;
        height: 100%;
    }

    .video-container {
        position: relative;
        width: 50%;
        height: 100%;
        overflow: hidden;
        background: #111;
    }

    video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
    }

    /* Mirror the camera image, like your original page */
    #localVideo {
        transform: scaleX(-1);
    }

    .label {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10;

        padding: 8px 12px;

        font-family: Arial, sans-serif;
        font-size: 14px;

        color: white;
        background: rgba(0, 0, 0, 0.6);

        border-radius: 4px;
    }

    #status {
        position: fixed;
        z-index: 100;

        bottom: 20px;
        left: 20px;

        padding: 10px 14px;

        font-family: Arial, sans-serif;
        font-size: 14px;

        color: white;
        background: rgba(0, 0, 0, 0.7);

        border-radius: 4px;
    }

</style>

</head>

<body>

<div id="videos">

    <!-- ==================================================
         LEFT SIDE: CAMERA
         ================================================== -->

    <div class="video-container">

        <div class="label">
            CAMERA
        </div>

        <video
            id="localVideo"
            autoplay
            muted
            playsinline>
        </video>

    </div>


    <!-- ==================================================
         RIGHT SIDE: TOUCHDESIGNER OUTPUT
         ================================================== -->

    <div class="video-container">

        <div class="label">
            TOUCHDESIGNER
        </div>

        <video
            id="processedVideo"
            autoplay
            playsinline>
        </video>

    </div>

</div>


<!-- ==================================================
     STATUS MESSAGE
     ================================================== -->

<div id="status">
    Starting...
</div>


<script>

    // ========================================================
    // GET REFERENCES TO HTML ELEMENTS
    // ========================================================

    const localVideo =
        document.getElementById("localVideo");

    const processedVideo =
        document.getElementById("processedVideo");

    const status =
        document.getElementById("status");


    // ========================================================
    // WEBRTC PEER CONNECTION
    // ========================================================

    const pc = new RTCPeerConnection({

        iceServers: [

            {
                urls:
                    "stun:stun.l.google.com:19302"
            }

        ]

    });


    // ========================================================
    // VARIABLES
    // ========================================================

    let cameraStream = null;

    let started = false;


    // ICE candidates can sometimes arrive before
    // the remote description has been set.
    const pendingCandidates = [];


    // ========================================================
    // CONNECT TO NODE.JS SIGNALING SERVER
    // ========================================================

    /*
        IMPORTANT:

        Our server.js is running on:

            localhost
            port 3000

        So we connect to:

            ws://localhost:3000

        NOT:

            ws://localhost:3000/ws

        because the server.js version we're using currently
        does not require the /ws path.
    */

    const signal = new WebSocket(
        "ws://localhost:3000"
    );


    // ========================================================
    // WEBSOCKET OPENED
    // ========================================================

    signal.onopen = () => {

        console.log(
            "Connected to signaling server"
        );

        status.textContent =
            "Connected to signaling server";


        // Tell the signaling server:
        //
        // "I am the browser, and I want to join
        //  the room called body-demo."

        signal.send(
            JSON.stringify({

                type: "join",

                room: "body-demo",

                role: "browser"

            })
        );

    };


    // ========================================================
    // RECEIVE MESSAGE FROM SIGNALING SERVER
    // ========================================================

    signal.onmessage = async (event) => {

        console.log(
            "SIGNAL RECEIVED:",
            event.data
        );


        const message =
            JSON.parse(event.data);


        // ----------------------------------------------------
        // SERVER SAYS BOTH SIDES ARE READY
        // ----------------------------------------------------

        if (message.type === "ready") {

            console.log(
                "TouchDesigner is ready!"
            );

            status.textContent =
                "TouchDesigner connected. Starting camera...";


            await startWebRTC();

        }


        // ----------------------------------------------------
        // TOUCHDESIGNER SENT AN ANSWER
        // ----------------------------------------------------

        else if (message.type === "answer") {

            console.log(
                "Received answer from TouchDesigner"
            );

            status.textContent =
                "Received TouchDesigner answer";


            await pc.setRemoteDescription(
                new RTCSessionDescription(
                    message.sdp
                )
            );


            // Add any ICE candidates that arrived
            // before the remote description.
            while (
                pendingCandidates.length > 0
            ) {

                const candidate =
                    pendingCandidates.shift();


                await pc.addIceCandidate(
                    candidate
                );

            }

        }


        // ----------------------------------------------------
        // TOUCHDESIGNER SENT AN ICE CANDIDATE
        // ----------------------------------------------------

        else if (message.type === "candidate") {

            console.log(
                "Received ICE candidate"
            );


            const candidate =
                new RTCIceCandidate(
                    message.candidate
                );


            if (pc.remoteDescription) {

                await pc.addIceCandidate(
                    candidate
                );

            }

            else {

                pendingCandidates.push(
                    candidate
                );

            }

        }


        // ----------------------------------------------------
        // TOUCHDESIGNER DISCONNECTED
        // ----------------------------------------------------

        else if (
            message.type === "peer-left"
        ) {

            console.log(
                "TouchDesigner disconnected"
            );

            status.textContent =
                "TouchDesigner disconnected";


            processedVideo.srcObject =
                null;

        }


        // ----------------------------------------------------
        // ERROR
        // ----------------------------------------------------

        else if (
            message.type === "error"
        ) {

            console.error(
                "SIGNALING ERROR:",
                message.message
            );

            status.textContent =
                "Signaling error: " +
                message.message;

        }

    };


    // ========================================================
    // START WEBRTC
    // ========================================================

    async function startWebRTC() {

        // Prevent this function from accidentally
        // running twice.
        if (started) {

            console.log(
                "WebRTC already started"
            );

            return;

        }

        started = true;


        console.log(
            "Starting WebRTC..."
        );


        // ----------------------------------------------------
        // ASK FOR CAMERA ACCESS
        // ----------------------------------------------------

        try {

            cameraStream =
                await navigator.mediaDevices.getUserMedia({

                    video: {

                        width: {
                            ideal: 1440
                        },

                        height: {
                            ideal: 2560
                        },

                        frameRate: {
                            ideal: 30
                        }

                    },

                    audio: false

                });

        }

        catch (error) {

            console.error(
                "Camera error:",
                error
            );

            status.textContent =
                "Camera error: " +
                error.message;

            alert(
                "Please allow camera access."
            );

            return;

        }


        console.log(
            "Camera permission granted"
        );


        // ----------------------------------------------------
        // SHOW CAMERA LOCALLY
        // ----------------------------------------------------

        localVideo.srcObject =
            cameraStream;


        // ----------------------------------------------------
        // SEND CAMERA TO TOUCHDESIGNER
        // ----------------------------------------------------

        for (
            const track
            of cameraStream.getTracks()
        ) {

            pc.addTrack(
                track,
                cameraStream
            );

        }


        // ----------------------------------------------------
        // CREATE WEBRTC OFFER
        // ----------------------------------------------------

        const offer =
            await pc.createOffer();


        await pc.setLocalDescription(
            offer
        );


        console.log(
            "Created WebRTC offer"
        );


        status.textContent =
            "Sending WebRTC offer to TouchDesigner";


        // ----------------------------------------------------
        // SEND OFFER THROUGH WEBSOCKET
        // ----------------------------------------------------

        signal.send(
            JSON.stringify({

                type: "offer",

                sdp: pc.localDescription

            })
        );

    }


    // ========================================================
    // SEND ICE CANDIDATES TO TOUCHDESIGNER
    // ========================================================

    pc.onicecandidate = (event) => {

        if (!event.candidate) {

            return;

        }


        console.log(
            "Sending ICE candidate"
        );


        signal.send(
            JSON.stringify({

                type: "candidate",

                candidate: {

                    candidate:
                        event.candidate.candidate,

                    sdpMid:
                        event.candidate.sdpMid,

                    sdpMLineIndex:
                        event.candidate.sdpMLineIndex

                }

            })
        );

    };


    // ========================================================
    // RECEIVE VIDEO FROM TOUCHDESIGNER
    // ========================================================

    pc.ontrack = (event) => {

    console.log(
        "===================================="
    );

    console.log(
        "RECEIVED VIDEO FROM TOUCHDESIGNER"
    );

    console.log(
        "Track:",
        event.track
    );

    console.log(
        "Track kind:",
        event.track.kind
    );

    console.log(
        "Track readyState:",
        event.track.readyState
    );

    console.log(
        "===================================="
    );


    if (
        event.streams &&
        event.streams[0]
    ) {

        processedVideo.srcObject =
            event.streams[0];


        processedVideo.onloadedmetadata = () => {

            console.log(
                "Processed video metadata loaded"
            );

            console.log(
                "Video width:",
                processedVideo.videoWidth
            );

            console.log(
                "Video height:",
                processedVideo.videoHeight
            );

        };


        processedVideo.onplaying = () => {

            console.log(
                "Processed video is PLAYING"
            );

        };


        processedVideo.play()
            .then(() => {

                console.log(
                    "processedVideo.play() succeeded"
                );

            })
            .catch((error) => {

                console.error(
                    "processedVideo.play() failed:",
                    error
                );

            });

    }

};


    // ========================================================
    // WEBRTC CONNECTION STATUS
    // ========================================================

    pc.onconnectionstatechange = () => {

        console.log(
            "WebRTC connection state:",
            pc.connectionState
        );


        status.textContent =
            "WebRTC: " +
            pc.connectionState;

    };


    // ========================================================
    // WEBSOCKET CLOSED
    // ========================================================

    signal.onclose = () => {

        console.log(
            "Signaling server disconnected"
        );


        status.textContent =
            "Signaling server disconnected";

    };


    // ========================================================
    // WEBSOCKET ERROR
    // ========================================================

    signal.onerror = (error) => {

        console.error(
            "WebSocket error:",
            error
        );


        status.textContent =
            "WebSocket error — check server";

    };

</script>
```

</body>
</html>
