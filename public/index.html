<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Happy 15th Anniversary!</title>


<style>

    /* =====================================================
       PAGE
       ===================================================== */

    html,
    body {

        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        background: #000;

    }


    /* =====================================================
       TOUCHDESIGNER OUTPUT
       ===================================================== */

    #processedVideo {

        position: absolute;

        inset: 0;

        width: 100%;
        height: 100%;

        object-fit: cover;
        object-position: center;

        z-index: 1;

    }


    /* =====================================================
       LOCAL CAMERA PREVIEW
       
       Holobox:
           1440 x 2560

       Aspect ratio:
           9 / 16

       25% screen height:
           640px

       Corresponding width:
           360px
       ===================================================== */

    #localVideo {

        position: absolute;

        top: 32px;
        right: 32px;

        height: 25vh;
        width: auto;

        aspect-ratio: 9 / 16;

        object-fit: cover;
        object-position: center;

        /* Mirror the user's camera preview. */
        transform: scaleX(-1);

        z-index: 10;

        background: #111;

        border: 3px solid rgba(
            255,
            255,
            255,
            0.9
        );

        border-radius: 8px;

        box-sizing: border-box;

        box-shadow:
            0 8px 30px rgba(
                0,
                0,
                0,
                0.35
            );

    }


    /* =====================================================
       DEBUG OVERLAY
       ===================================================== */

    #debugOverlay {

        position: fixed;

        top: 24px;
        left: 24px;

        z-index: 100;

        min-width: 300px;

        padding: 16px 18px;

        box-sizing: border-box;

        font-family:
            "Courier New",
            monospace;

        font-size: 13px;
        line-height: 1.5;

        color: #fff;

        background:
            rgba(0, 0, 0, 0.78);

        border:
            1px solid rgba(
                255,
                255,
                255,
                0.25
            );

        border-radius: 8px;

        box-shadow:
            0 8px 30px rgba(
                0,
                0,
                0,
                0.3
            );

    }


    /* =====================================================
       DEBUG HEADER
       ===================================================== */

    #debugTitle {

        margin-bottom: 10px;

        font-family: Arial, sans-serif;

        font-size: 13px;
        font-weight: bold;

        letter-spacing: 0.08em;

        text-transform: uppercase;

        opacity: 0.8;

    }


    /* =====================================================
       DEBUG ROWS
       ===================================================== */

    .debugRow {

        display: flex;

        justify-content: space-between;

        gap: 20px;

        white-space: nowrap;

    }


    .debugLabel {

        opacity: 0.65;

    }


    .debugValue {

        text-align: right;

    }


    /* =====================================================
       STATUS COLORS
       ===================================================== */

    .status-good {

        color: #6cff8f;

    }


    .status-warn {

        color: #ffd86c;

    }


    .status-bad {

        color: #ff6c6c;

    }


    /* =====================================================
       DEBUG FOOTER
       ===================================================== */

    #debugHint {

        margin-top: 10px;

        padding-top: 8px;

        border-top:
            1px solid rgba(
                255,
                255,
                255,
                0.15
            );

        font-family: Arial, sans-serif;

        font-size: 11px;

        opacity: 0.45;

    }


    /* =====================================================
       CAMERA ERROR MESSAGE
       ===================================================== */

    #cameraError {

        display: none;

        position: fixed;

        left: 50%;
        top: 50%;

        transform:
            translate(-50%, -50%);

        z-index: 200;

        padding: 20px 24px;

        max-width: 500px;

        font-family: Arial, sans-serif;

        font-size: 18px;
        line-height: 1.4;

        text-align: center;

        color: white;

        background:
            rgba(0, 0, 0, 0.9);

        border-radius: 8px;

    }

</style>


</head>

<body>


<!-- =====================================================
     TOUCHDESIGNER OUTPUT
     ===================================================== -->

<video
    id="processedVideo"
    autoplay
    playsinline>
</video>


<!-- =====================================================
     LOCAL CAMERA PREVIEW
     ===================================================== -->

<video
    id="localVideo"
    autoplay
    muted
    playsinline>
</video>


<!-- =====================================================
     DEBUG OVERLAY
     ===================================================== -->

<div id="debugOverlay">

    <div id="debugTitle">
        Holobox Debug
    </div>


    <div class="debugRow">

        <span class="debugLabel">
            SIGNALING
        </span>

        <span
            id="debugSignaling"
            class="debugValue status-warn">
            CONNECTING
        </span>

    </div>


    <div class="debugRow">

        <span class="debugLabel">
            WEBRTC
        </span>

        <span
            id="debugWebRTC"
            class="debugValue status-warn">
            NEW
        </span>

    </div>


    <div class="debugRow">

        <span class="debugLabel">
            ICE
        </span>

        <span
            id="debugICE"
            class="debugValue status-warn">
            NEW
        </span>

    </div>


    <div class="debugRow">

        <span class="debugLabel">
            CAMERA
        </span>

        <span
            id="debugCamera"
            class="debugValue status-warn">
            WAITING
        </span>

    </div>


    <div class="debugRow">

        <span class="debugLabel">
            REMOTE VIDEO
        </span>

        <span
            id="debugRemote"
            class="debugValue status-warn">
            WAITING
        </span>

    </div>


    <div class="debugRow">

        <span class="debugLabel">
            LOCAL RESOLUTION
        </span>

        <span
            id="debugLocalResolution"
            class="debugValue">
            —
        </span>

    </div>


    <div class="debugRow">

        <span class="debugLabel">
            REMOTE RESOLUTION
        </span>

        <span
            id="debugRemoteResolution"
            class="debugValue">
            —
        </span>

    </div>


    <div id="debugHint">
        Development overlay — hide before final installation.
    </div>

</div>


<!-- =====================================================
     CAMERA ERROR
     ===================================================== -->

<div id="cameraError"></div>


<script>

    // ====================================================
    // DEBUG MODE
    // ====================================================

    /*
        Set this to false when you're ready for the
        clean installation version.

        For now, keep it TRUE.
    */

    const DEBUG_MODE = true;


    // ====================================================
    // HTML ELEMENTS
    // ====================================================

    const localVideo =
        document.getElementById(
            "localVideo"
        );


    const processedVideo =
        document.getElementById(
            "processedVideo"
        );


    const debugOverlay =
        document.getElementById(
            "debugOverlay"
        );


    const cameraError =
        document.getElementById(
            "cameraError"
        );


    const debugSignaling =
        document.getElementById(
            "debugSignaling"
        );


    const debugWebRTC =
        document.getElementById(
            "debugWebRTC"
        );


    const debugICE =
        document.getElementById(
            "debugICE"
        );


    const debugCamera =
        document.getElementById(
            "debugCamera"
        );


    const debugRemote =
        document.getElementById(
            "debugRemote"
        );


    const debugLocalResolution =
        document.getElementById(
            "debugLocalResolution"
        );


    const debugRemoteResolution =
        document.getElementById(
            "debugRemoteResolution"
        );


    // ====================================================
    // ENABLE / DISABLE DEBUG OVERLAY
    // ====================================================

    if (!DEBUG_MODE) {

        debugOverlay.style.display =
            "none";

    }


    // ====================================================
    // HELPER: UPDATE DEBUG STATUS
    // ====================================================

    function setStatus(
        element,
        text,
        state
    ) {

        element.textContent =
            text;

        element.classList.remove(
            "status-good",
            "status-warn",
            "status-bad"
        );


        if (state === "good") {

            element.classList.add(
                "status-good"
            );

        }

        else if (
            state === "bad"
        ) {

            element.classList.add(
                "status-bad"
            );

        }

        else {

            element.classList.add(
                "status-warn"
            );

        }

    }


    // ====================================================
    // SIGNALING SERVER
    // ====================================================

    /*
        This is the Cloudflare Worker.

        Keep your existing working URL here.
    */

    const SIGNALING_URL =
        "wss://body-signaling.reeseyh18.workers.dev/ws";


    // ====================================================
    // WEBRTC
    // ====================================================

    const pc =
        new RTCPeerConnection({

            iceServers: [

                {

                    urls:
                        "stun:stun.l.google.com:19302"

                }

            ]

        });


    // ====================================================
    // VARIABLES
    // ====================================================

    let cameraStream = null;

    let started = false;

    const pendingCandidates = [];


    // ====================================================
    // INITIAL WEBRTC DEBUG STATUS
    // ====================================================

    setStatus(
        debugWebRTC,
        pc.connectionState.toUpperCase(),
        "warn"
    );


    // ====================================================
    // SIGNALING CONNECTION
    // ====================================================

    const signal =
        new WebSocket(
            SIGNALING_URL
        );


    // ====================================================
    // SIGNALING OPEN
    // ====================================================

    signal.onopen = () => {

        console.log(
            "Connected to signaling server"
        );


        setStatus(
            debugSignaling,
            "CONNECTED",
            "good"
        );


        signal.send(

            JSON.stringify({

                type: "join",

                room: "body-demo",

                role: "browser"

            })

        );

    };


    // ====================================================
    // SIGNALING MESSAGE
    // ====================================================

    signal.onmessage =
        async (event) => {

            console.log(
                "SIGNAL RECEIVED:",
                event.data
            );


            const message =
                JSON.parse(
                    event.data
                );


            // ------------------------------------------------
            // JOINED
            // ------------------------------------------------

            if (
                message.type === "joined"
            ) {

                console.log(
                    "Joined signaling room:",
                    message.room
                );

            }


            // ------------------------------------------------
            // READY
            // ------------------------------------------------

            else if (
                message.type === "ready"
            ) {

                console.log(
                    "TouchDesigner is ready"
                );


                await startWebRTC();

            }


            // ------------------------------------------------
            // ANSWER
            // ------------------------------------------------

            else if (
                message.type === "answer"
            ) {

                console.log(
                    "Received answer from TouchDesigner"
                );


                await pc.setRemoteDescription(

                    new RTCSessionDescription(
                        message.sdp
                    )

                );


                while (
                    pendingCandidates.length > 0
                ) {

                    const candidate =
                        pendingCandidates.shift();


                    await pc.addIceCandidate(
                        candidate
                    );

                }

            }


            // ------------------------------------------------
            // ICE CANDIDATE
            // ------------------------------------------------

            else if (
                message.type === "candidate"
            ) {

                const candidate =
                    new RTCIceCandidate(
                        message.candidate
                    );


                if (
                    pc.remoteDescription
                ) {

                    await pc.addIceCandidate(
                        candidate
                    );

                }

                else {

                    pendingCandidates.push(
                        candidate
                    );

                }

            }


            // ------------------------------------------------
            // TOUCHDESIGNER LEFT
            // ------------------------------------------------

            else if (
                message.type === "peer-left"
            ) {

                console.log(
                    "TouchDesigner disconnected"
                );


                setStatus(
                    debugWebRTC,
                    "DISCONNECTED",
                    "bad"
                );


                setStatus(
                    debugRemote,
                    "DISCONNECTED",
                    "bad"
                );


                processedVideo.srcObject =
                    null;

            }


            // ------------------------------------------------
            // SERVER ERROR
            // ------------------------------------------------

            else if (
                message.type === "error"
            ) {

                console.error(
                    "SIGNALING ERROR:",
                    message.message
                );


                setStatus(
                    debugSignaling,
                    "ERROR",
                    "bad"
                );

            }

        };


    // ====================================================
    // START WEBRTC
    // ====================================================

    async function startWebRTC() {

        if (started) {

            return;

        }


        started = true;


        console.log(
            "Starting WebRTC..."
        );


        // ------------------------------------------------
        // GET CAMERA
        // ------------------------------------------------

        try {

            cameraStream =
                await navigator.mediaDevices
                    .getUserMedia({

                        video: {

                            width: {
                                ideal: 1440
                            },

                            height: {
                                ideal: 2560
                            },

                            frameRate: {
                                ideal: 30
                            }

                        },

                        audio: false

                    });

        }

        catch (error) {

            console.error(
                "Camera error:",
                error
            );


            setStatus(
                debugCamera,
                "ERROR",
                "bad"
            );


            cameraError.textContent =
                "Camera access failed. " +
                "Please make sure the Holobox browser " +
                "has permission to use the camera.";


            cameraError.style.display =
                "block";


            return;

        }


        console.log(
            "Camera permission granted"
        );


        // ------------------------------------------------
        // SHOW CAMERA
        // ------------------------------------------------

        localVideo.srcObject =
            cameraStream;


        setStatus(
            debugCamera,
            "CONNECTED",
            "good"
        );


        // Display actual camera resolution.
        localVideo.onloadedmetadata =
            () => {

                debugLocalResolution.textContent =
                    localVideo.videoWidth +
                    " × " +
                    localVideo.videoHeight;

            };


        // ------------------------------------------------
        // SEND CAMERA TO TOUCHDESIGNER
        // ------------------------------------------------

        for (
            const track
            of cameraStream.getTracks()
        ) {

            pc.addTrack(
                track,
                cameraStream
            );

        }


        // ------------------------------------------------
        // CREATE OFFER
        // ------------------------------------------------

        const offer =
            await pc.createOffer();


        await pc.setLocalDescription(
            offer
        );


        console.log(
            "Created WebRTC offer"
        );


        // ------------------------------------------------
        // SEND OFFER
        // ------------------------------------------------

        signal.send(

            JSON.stringify({

                type: "offer",

                sdp:
                    pc.localDescription

            })

        );

    }


    // ====================================================
    // SEND ICE CANDIDATES
    // ====================================================

    pc.onicecandidate =
        (event) => {

            if (
                !event.candidate
            ) {

                return;

            }


            signal.send(

                JSON.stringify({

                    type: "candidate",

                    candidate: {

                        candidate:
                            event.candidate
                                .candidate,

                        sdpMid:
                            event.candidate
                                .sdpMid,

                        sdpMLineIndex:
                            event.candidate
                                .sdpMLineIndex

                    }

                })

            );

        };


    // ====================================================
    // ICE CONNECTION STATE
    // ====================================================

    pc.oniceconnectionstatechange =
        () => {

            console.log(
                "ICE state:",
                pc.iceConnectionState
            );


            setStatus(
                debugICE,
                pc.iceConnectionState
                    .toUpperCase(),
                pc.iceConnectionState ===
                    "connected" ||
                pc.iceConnectionState ===
                    "completed"
                    ? "good"
                    : pc.iceConnectionState ===
                        "failed"
                        ? "bad"
                        : "warn"
            );

        };


    // ====================================================
    // WEBRTC CONNECTION STATE
    // ====================================================

    pc.onconnectionstatechange =
        () => {

            console.log(
                "WebRTC connection state:",
                pc.connectionState
            );


            setStatus(
                debugWebRTC,
                pc.connectionState
                    .toUpperCase(),
                pc.connectionState ===
                    "connected"
                    ? "good"
                    : pc.connectionState ===
                        "failed" ||
                      pc.connectionState ===
                        "disconnected"
                        ? "bad"
                        : "warn"
            );

        };


    // ====================================================
    // RECEIVE TOUCHDESIGNER VIDEO
    // ====================================================

    pc.ontrack =
        (event) => {

            console.log(
                "Received video track from TouchDesigner"
            );


            if (
                event.streams &&
                event.streams[0]
            ) {

                processedVideo.srcObject =
                    event.streams[0];


                setStatus(
                    debugRemote,
                    "RECEIVED",
                    "good"
                );


                processedVideo.onloadedmetadata =
                    () => {

                        debugRemoteResolution.textContent =
                            processedVideo.videoWidth +
                            " × " +
                            processedVideo.videoHeight;

                    };


                processedVideo.onplaying =
                    () => {

                        setStatus(
                            debugRemote,
                            "PLAYING",
                            "good"
                        );

                    };


                processedVideo.play()
                    .catch(
                        (error) => {

                            console.error(
                                "Video play error:",
                                error
                            );

                            setStatus(
                                debugRemote,
                                "PLAY ERROR",
                                "bad"
                            );

                        }
                    );

            }

        };


    // ====================================================
    // WEBSOCKET CLOSED
    // ====================================================

    signal.onclose = () => {

        console.log(
            "Signaling server disconnected"
        );


        setStatus(
            debugSignaling,
            "DISCONNECTED",
            "bad"
        );

    };


    // ====================================================
    // WEBSOCKET ERROR
    // ====================================================

    signal.onerror =
        (error) => {

            console.error(
                "WebSocket error:",
                error
            );


            setStatus(
                debugSignaling,
                "ERROR",
                "bad"
            );

        };

</script>
```

</html>
